services:
  backend:
    image: ${DOCKERHUB_USERNAME:?Configura DOCKERHUB_USERNAME}/citasmedicas-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:?Configura SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Configura SUPABASE_SERVICE_ROLE_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    expose:
      - "3001"
    networks:
      - citas

  frontend:
    image: ${DOCKERHUB_USERNAME:?Configura DOCKERHUB_USERNAME}/citasmedicas-frontend:latest
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - citas

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - citas

networks:
  citas:
